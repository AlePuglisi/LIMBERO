joint_trajectory_controller:
  ros__parameters:
    joints:
      - LF_B2C
      - LF_C2F
      - LF_F2T
      - LF_T2E
      - LF_wristH
      - LF_wristV
      - LF_driving
      - LH_B2C
      - LH_C2F
      - LH_F2T
      - LH_T2E
      - LH_wristH
      - LH_wristV
      - LH_driving
      - RH_B2C
      - RH_C2F
      - RH_F2T
      - RH_T2E
      - RH_wristH
      - RH_wristV
      - RH_driving
      - RF_B2C
      - RF_C2F
      - RF_F2T
      - RF_T2E
      - RF_wristH
      - RF_wristV
      - RF_driving

    command_interfaces:
      - effort

    state_interfaces:
      - position
      - velocity

    action_monitor_rate: 20.0  # Defaults to 20
    state_publish_rate: 50.0 # Defaults to 50

    allow_partial_joints_goal: false  # Defaults to false
    open_loop_control: false # has to be false
    allow_integration_in_goal_trajectories: true
    constraints:
      stopped_velocity_tolerance: 0.01  # Defaults to 0.01
      goal_time: 0.0  # Defaults to 0.0 (start immediately)

    gains:
      LF_B2C:
        p: 60.0
        i: 0.0
        d: 0.0
        #i_clamp: 1.0
        ff_velocity_scale: 1.0
      LF_C2F:
        p: 100.0
        i: 0.01
        d: 0.0
        #i_clamp: 1.0
        ff_velocity_scale: 1.0
      LF_F2T:
        p: 100.0
        i: 0.01
        d: 0.0
        #i_clamp: 1.0
        ff_velocity_scale: 1.0
      LF_T2E:
        p: 50.0
        i: 0.0       
        d: 0.0
        #i_clamp: 1.0
        ff_velocity_scale: 1.0
      LF_wristH:
        p: 50.0
        i: 0.0
        d: 0.0
        #i_clamp: 1.0
        ff_velocity_scale: 1.0
      LF_wristV:
        p: 50.0
        i: 0.0
        d: 0.0
        #i_clamp: 1.0
        ff_velocity_scale: 1.0
      LF_driving:
        p: 50.0
        i: 0.0      
        d: 0.0        
        #i_clamp: 1.0
        ff_velocity_scale: 0.0
      LH_B2C:
