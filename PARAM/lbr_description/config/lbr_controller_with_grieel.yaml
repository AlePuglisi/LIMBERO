controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # forward_effort_controller:
    #   type: forward_command_controller/ForwardCommandController

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
    joints:
      - LF_B2C
      - LF_C2F
      - LF_F2T
      - LF_T2E
      - LF_wristH
      - LF_wristV
      - LF_driving
      - LH_B2C
      - LH_C2F
      - LH_F2T
      - LH_T2E
      - LH_wristH
      - LH_wristV
      - LH_driving
      - RH_B2C
      - RH_C2F
      - RH_F2T
      - RH_T2E
      - RH_wristH
      - RH_wristV
      - RH_driving
      - RF_B2C
      - RF_C2F
      - RF_F2T
      - RF_T2E
      - RF_wristH
      - RF_wristV
      - RF_driving

