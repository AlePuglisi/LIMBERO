grieel_action_controller_LF:
  ros__parameters:
    use_sim_time: true
    joint: LF_F1_H2P1
    action_monitor_rate: 20.0
    goal_tolerance: 0.01
    max_effort: 100.0
    allow_stalling: false
    stall_velocity_threshold: 0.001
    stall_timeout: 1.0

