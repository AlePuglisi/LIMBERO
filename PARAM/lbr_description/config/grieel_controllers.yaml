controller_manager:
  ros__parameters:
    update_rate: 1000
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    limb_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    drive_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # Controls the gripper
    grieel_action_controller_LF:
      type: position_controllers/GripperActionController
    grieel_action_controller_LH:
      type: position_controllers/GripperActionController
    grieel_action_controller_RH:
      type: position_controllers/GripperActionController
    grieel_action_controller_RF:
      type: position_controllers/GripperActionController
      
limb_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - LF_B2C
      - LF_C2F
      - LF_F2T
      - LF_T2E
      - LF_wristH
      - LF_wristV
      - LH_B2C
      - LH_C2F
      - LH_F2T
      - LH_T2E
      - LH_wristH
      - LH_wristV
      - RH_B2C
      - RH_C2F
      - RH_F2T
      - RH_T2E
      - RH_wristH
      - RH_wristV
      - RF_B2C
      - RF_C2F
      - RF_F2T
      - RF_T2E
      - RF_wristH
      - RF_wristV


    # The controller will expect position commands as input for each of these joints.
    command_interfaces:
      - effort

    # Tells the controller that it should expect to receive position data as the state
    # feedback from the hardware interface.
    state_interfaces:
      - position
      - velocity

    # If true, When set to true, the controller will not use any feedback from the system
    # (e.g., joint positions, velocities, efforts) to compute the control commands.
    open_loop_control: false

    # When set to true, it allows the controller to integrate the trajectory goals it receives.
    # This means that if the goal trajectory only specifies positions, the controller will
    # numerically integrate the positions to compute the velocities and accelerations required
    # to follow the trajectory.
    allow_integration_in_goal_trajectories: true

    # Allow non-zero velocity at the end of the trajectory
    allow_nonzero_velocity_at_trajectory_end: true
    constraints:
      goal_time: 0.0
      stopped_velocity_tolerance: 0.01
      
    gains:
      LF_B2C:
        p: 1000.0
        i: 3.0
        d: 0.1
        #i_clamp: 1.0
        ff_velocity_scale: 0.8
      LF_C2F:
        p: 1000.0
        i: 3.0
        d: 0.1
        #i_clamp: 1.0
        ff_velocity_scale: 0.8
      LF_F2T:
        p: 1000.0
        i: 3.0
        d: 0.1
        #i_clamp: 1.0
        ff_velocity_scale: 0.8
      LF_T2E:
        p: 1000.0
        i: 3.0      
        d: 0.1
        #i_clamp: 1.0
        ff_velocity_scale: 0.8
      LF_wristH:
        p: 1000.0
        i: 3.0
        d: 0.1
        #i_clamp: 1.0
        ff_velocity_scale: 0.8
      LF_wristV:
        p: 1000.0
        i: 3.0
        d: 0.1
        #i_clamp: 1.0
        ff_velocity_scale: 0.8

      LH_B2C:
